# Production stack for one VPS. Only Caddy publishes ports; see DEPLOY.md.
name: upoharlab

# Without a limit, container logs can slowly fill the server's disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-upoharlab}
      POSTGRES_USER: ${DB_USER:-upoharlab}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [internal]
    logging: *logging
    restart: unless-stopped

  app:
    build: .
    image: upoharlab-app:${APP_VERSION:-local}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      APP_BASE_URL: ${APP_BASE_URL:?Set APP_BASE_URL in .env, for example https://upoharlab.com}
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-upoharlab}
      DB_USER: ${DB_USER:-upoharlab}
      DB_USERNAME: ${DB_USER:-upoharlab}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      ORDERS_PER_HOUR: ${ORDERS_PER_HOUR:-5}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      FACEBOOK_PIXEL_ID: ${FACEBOOK_PIXEL_ID:-}
    mem_limit: ${APP_MEMORY_LIMIT:-640m}
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /robots.txt HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          head -n1 <&3 | grep -q ' 200 '
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    networks: [internal]
    logging: *logging
    restart: unless-stopped

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    image: upoharlab-caddy:${APP_VERSION:-local}
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN in .env, for example upoharlab.com}
      CADDY_GLOBAL_OPTIONS: ${CADDY_GLOBAL_OPTIONS:-}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      internal:
        ipv4_address: 172.30.57.20
    logging: *logging
    restart: unless-stopped

networks:
  internal:
    ipam:
      config:
        - subnet: 172.30.57.0/24

volumes:
  postgres_data:
  uploads_data:
  caddy_data:
  caddy_config:
