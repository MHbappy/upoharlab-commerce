spring:
  application:
    name: upoharlab
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/upoharlab}
    username: ${DB_USER:upoharlab}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      connection-init-sql: SET TIME ZONE 'UTC'
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB
  mvc:
    log-request-details: false
server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
  forward-headers-strategy: none
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax
        secure: false
app:
  business-zone: Asia/Dhaka
  uploads-directory: ${UPLOADS_DIRECTORY:/data/uploads}
  admin:
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}
