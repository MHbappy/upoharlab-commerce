spring:
  application:
    name: upoharlab
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/upoharlab}
    username: ${DB_USER:upoharlab}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      connection-init-sql: SET TIME ZONE 'UTC'
      data-source-properties:
        # Keeps row contents such as phone numbers out of database errors and logs.
        logServerErrorDetail: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      # The 5 MB photo rule is enforced in ImageStorage so the editor can explain it.
      max-file-size: 20MB
      max-request-size: 21MB
  mvc:
    log-request-details: false
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 365d
      chain:
        strategy:
          content:
            enabled: true
            paths: /**
server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
  forward-headers-strategy: none
  tomcat:
    # Read over-limit uploads to the end, so browsers get the error page and not a reset.
    max-swallow-size: 25MB
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax
        secure: false
app:
  business-zone: Asia/Dhaka
  uploads-directory: ${UPLOADS_DIRECTORY:./uploads}
  base-url: ${APP_BASE_URL:}
  orders:
    max-per-hour: ${ORDERS_PER_HOUR:5}
  tracking:
    max-per-ip: ${TRACKING_PER_15_MINUTES:10}
    max-failures-per-code: ${TRACKING_FAILURES_PER_HOUR:5}
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    chat-id: ${TELEGRAM_CHAT_ID:}
  admin:
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}
