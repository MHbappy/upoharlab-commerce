## Privacy page
privacy.meta.title=গোপনীয়তা
privacy.meta.description=অর্ডারের কোন তথ্য রাখি, কেন রাখি আর কে দেখতে পারে।
privacy.title=গোপনীয়তা
privacy.s1.title=কী তথ্য রাখি
privacy.s1.text=অর্ডারে দেওয়া নাম, ফোন নম্বর, ঠিকানা, উপহারে লেখার কথা আর আপনার নোট। সঙ্গে অর্ডারের দাম, অবস্থা, টাকার হিসাব আর কুরিয়ারের তথ্য।
privacy.s2.title=কেন রাখি
privacy.s2.text=আপনার উপহার বানানো, ডিজাইন দেখাতে যোগাযোগ করা, টাকার হিসাব রাখা আর উপহারটা আপনার কাছে পৌঁছে দেওয়ার জন্য।
privacy.s3.title=কে দেখতে পারে
privacy.s3.text=আপনার পুরো তথ্য শুধু দোকানের মালিক অ্যাডমিন প্যানেলে দেখতে পারেন। কুরিয়ারকে শুধু ততটুকুই দিই, যতটুকু উপহার পৌঁছাতে দরকার। WhatsApp আর bKash-এ আপনার সঙ্গে কথা বা লেনদেনের তথ্য সেই সেবাগুলোর নিজস্ব নিয়মে থাকে।
privacy.s4.title=অর্ডার ট্র্যাক
privacy.s4.text=অর্ডার কোড আর পুরো ফোন নম্বর মিললে শুধু অর্ডারের অবস্থা, তারিখ আর কুরিয়ারের তথ্য দেখানো হয়। নাম, ঠিকানা বা উপহারের লেখা দেখানো হয় না।
privacy.cookies.title=কুকি ও ব্যাকআপ
privacy.cookies.text=অর্ডার ফর্ম আর নিশ্চিতকরণ পাতা চালাতে একটা সেশন কুকি ব্যবহার হয়।
privacy.cookies.pixel=অর্ডারের পাতায় বিজ্ঞাপনের ফলাফল মাপতে Facebook Pixel ব্যবহার হয়; এতে আপনার নাম, ফোন বা ঠিকানা পাঠানো হয় না।
privacy.cookies.none=বিজ্ঞাপন বা ভিজিটর ট্র্যাক করার কোনো টুল এই সাইটে নেই।
privacy.cookies.backup=তথ্য হারিয়ে না যায় তাই নিয়মিত ব্যাকআপ রাখি, যা ১৪ দিন পর্যন্ত থাকে।
privacy.delete.title=তথ্য বদলাতে বা মুছতে চাইলে
privacy.delete.text=অর্ডার কোডসহ আমাদের জানান। ব্যাকআপ থেকে তথ্য সঙ্গে সঙ্গে মোছে না; নির্দিষ্ট সময় পরে সেখান থেকেও সরে যায়।

## Error pages
error.404.title=পাতাটা খুঁজে পাওয়া গেল না
error.404.text=ঠিকানাটা হয়তো ভুল, অথবা পাতাটা এখন আর নেই। হোম পাতা থেকে আবার খুঁজে দেখুন।
error.403.title=পাতাটা পুরোনো হয়ে গেছে
error.403.text=অনেকক্ষণ পর পাঠালে এমন হয়। পাতাটা আবার খুলে চেষ্টা করুন।
error.other.title=কোথাও একটা গোলমাল হয়েছে
error.other.text=একটু পরে আবার চেষ্টা করুন। সমস্যা থেকে গেলে আমাদের জানান।

