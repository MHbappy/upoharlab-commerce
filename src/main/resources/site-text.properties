home.faq.eyebrow=অর্ডারের আগে জেনে নিন
home.faq.title=মনে কোনো প্রশ্ন আছে?
home.faq.caption=অর্ডারের আগে সবাই যা জানতে চান।
home.faq.all=সব প্রশ্নের উত্তর দেখুন →
home.faq1.q=অর্ডার দেওয়ার সময়ই কি টাকা দিতে হবে?
home.faq1.a=না, অর্ডার দিতে কোনো টাকা লাগে না। কিছু জিনিসে কাজ শুরুর আগে অল্প অগ্রিম লাগে — সেটা জিনিসের পাতাতেই লেখা থাকে। বাকি টাকা হাতে পেয়ে দেবেন।
home.faq2.q=হাতে পেতে কত দিন লাগবে?
home.faq2.a=প্রতিটি জিনিসের নামের নিচেই লেখা আছে কত দিনে হাতে পাবেন। অর্ডার নিশ্চিত হওয়ার দিন থেকে সময় গোনা শুরু হয়।
home.faq3.q=ডেলিভারি চার্জ কত?
home.faq3.a=ঢাকার ভেতরে আর বাইরে চার্জ আলাদা। অর্ডার ফর্মে এলাকা বেছে নিলেই মোট হিসাবে দেখতে পাবেন — পরে বাড়তি কিছু যোগ হয় না।
home.faq4.q=সারা দেশে কি পাঠান?
home.faq4.a=হ্যাঁ। কুরিয়ারে বাংলাদেশের যেকোনো জায়গায় পাঠাই।
home.faq5.q=অর্ডারটা কোথায় আছে, কীভাবে জানব?
home.faq5.a=মেনুর "অর্ডার ট্র্যাক" পাতায় অর্ডার কোড আর ফোন নম্বর দিলেই দেখতে পাবেন। পাঠানোর পর কুরিয়ারের ট্র্যাকিং নম্বরও জানিয়ে দেব।
home.faq6.q=হাতে পেয়ে কোনো সমস্যা দেখলে কী করব?
home.faq6.a=ভাঙা বা ভুল কিছু পেলে অর্ডার কোডসহ যত তাড়াতাড়ি সম্ভব আমাদের জানান। ছবি পাঠালে আরও তাড়াতাড়ি দেখে ব্যবস্থা নিতে পারব।
home.contact.title=উত্তর খুঁজে পাননি?
home.contact.text=কোনটা নেবেন বা কী লিখবেন — WhatsApp-এ জিজ্ঞেস করুন, একসঙ্গে ঠিক করে ফেলি।
