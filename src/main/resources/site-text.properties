home.meta.title=আপনার গল্প, আপনার ছোঁয়ায়
home.meta.description=একটা নাম, একটা তারিখ, প্রিয় কোনো লাইন — যা আপনার কাছে বিশেষ, তা-ই ফুটিয়ে তুলি আপনার পছন্দের ডিজাইনে। নিজের জন্য রাখুন বা কাউকে দিন, অর্ডারের আগেই দেখে নিন কেমন হবে।
