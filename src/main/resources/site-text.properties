## Frequently asked questions page
faq.meta.title=সাধারণ জিজ্ঞাসা
faq.meta.description=টাকা দেওয়া, ডেলিভারি আর নিজের লেখা নিয়ে সবচেয়ে বেশি যা জানতে চান।
faq.eyebrow=জেনে নিন, নিশ্চিন্তে থাকুন
faq.title=সাধারণ জিজ্ঞাসা
faq.lead=উপহার বাছা থেকে হাতে পাওয়া পর্যন্ত — আপনার প্রশ্নগুলোর উত্তর এক জায়গায়।
faq.design.title=লেখা ও ডিজাইন
faq.design.q1=কী লেখা যাবে?
faq.design.a1=প্রতিটি জিনিসের পাতায় লেখা আছে সেখানে কী বসানো যায় — নাম, তারিখ, ছোট্ট কোনো বার্তা। অর্ডার ফর্মে আপনার কথাটা লিখে দিন। একাধিক জিনিসে আলাদা লেখা চাইলে প্রতিটি আলাদা লাইনে লিখুন।
faq.design.q2=নিজের লেখা দিলে কি আগে ডিজাইনটা দেখতে পাব?
faq.design.a2=হ্যাঁ। যেসব জিনিসে আপনার লেখা থাকে, বানানোর আগে WhatsApp-এ ডিজাইন পাঠাই। বানান আর ডিজাইন দেখে আপনি হ্যাঁ বললে তবেই কাজ শুরু হয়।
faq.design.q3=বানান ভুল লিখে ফেললে কী হবে?
faq.design.a3=চিন্তা নেই — ডিজাইন দেখার সময়ই জানিয়ে দিন, ঠিক করে দেব। শুধু সম্মতি দেওয়ার আগে বানানটা ভালো করে মিলিয়ে নেবেন।
faq.money.title=দাম ও টাকা
faq.money.q1=টাকা কখন দিতে হবে?
faq.money.a1=অর্ডার দিতে কোনো টাকা লাগে না। কিছু জিনিসে কাজ শুরুর আগে অল্প অগ্রিম লাগে — সেটা জিনিসের পাতাতেই লেখা থাকে। বাকি টাকা হাতে পেয়ে দেবেন।
faq.money.q2=মোট দামে কী কী ধরা থাকে?
faq.money.a2=উপহারের দাম আর ডেলিভারি চার্জ। অর্ডার পাঠানোর আগেই ফর্মে পুরো হিসাব দেখে নিতে পারবেন, পরে বাড়তি কিছু যোগ হবে না।
faq.delivery.title=ডেলিভারি
faq.delivery.charge.q=ডেলিভারি চার্জ কত?
faq.delivery.charge.a=ঢাকার ভেতরে {0}, ঢাকার বাইরে {1}।
faq.delivery.when.q=কবে হাতে পাব?
faq.delivery.when.a=অর্ডার নিশ্চিত হওয়ার পর বানানো শুরু হয়। প্রতিটি জিনিসের পাতায় লেখা আছে কত দিনে হাতে পাবেন।
faq.delivery.when.link=ডেলিভারির বিস্তারিত দেখুন
faq.track.q=অর্ডারটা কোন পর্যায়ে আছে, কীভাবে জানব?
faq.track.a=অর্ডার কোড আর ফোন নম্বর নিয়ে চলে যান —
faq.track.link=অর্ডার ট্র্যাক পাতায়
faq.delivery.area.q=সারা দেশে কি পাঠান?
faq.delivery.area.a=হ্যাঁ। কুরিয়ারে বাংলাদেশের যেকোনো জায়গায় পাঠাই।
faq.other.title=অন্যান্য
faq.other.q1=হাতে পেয়ে কোনো সমস্যা দেখলে কী করব?
faq.other.a1=ভাঙা বা ভুল কিছু পেলে অর্ডার কোডসহ যত তাড়াতাড়ি সম্ভব আমাদের জানান। ছবি পাঠালে আরও তাড়াতাড়ি দেখে ব্যবস্থা নিতে পারব।
faq.other.q2=একসঙ্গে অনেকগুলো নিতে চাইলে?
faq.other.a2=অফিস, প্রতিষ্ঠান বা অনুষ্ঠানের জন্য একসঙ্গে ১০টির বেশি লাগলে আগে আমাদের সঙ্গে কথা বলে দাম জেনে নিন।
faq.other.q3=কীভাবে যোগাযোগ করব?
faq.other.a3=WhatsApp বা ফোনে মেসেজ দিন, আমরা উত্তর দেব। পাতার একদম নিচে যোগাযোগের তথ্য দেওয়া আছে।
