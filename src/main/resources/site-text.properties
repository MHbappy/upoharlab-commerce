## Returns and cancellation page
returns.meta.title=ফেরত ও বাতিল
returns.meta.description=ডিজাইন বদলানো, অর্ডার বাতিল বা উপহারে সমস্যা হলে কী করবেন।
returns.title=ফেরত ও বাতিল
returns.before.title=বানানোর আগে
returns.before.text=অর্ডার দিতে টাকা লাগে না। অর্ডার পেয়ে আমরা ফোন করে নিশ্চিত হই; নিজের লেখা থাকলে আগে WhatsApp-এ ডিজাইন দেখাই, আপনি সম্মতি দিলে তবেই কাজ শুরু হয়। কিছু জিনিসে কাজ শুরুর আগে অল্প অগ্রিম লাগে — ডিজাইন পছন্দ না হলে সেই অগ্রিম ফেরত পাবেন। বাকি টাকা হাতে পেয়ে দেবেন।
returns.problem.title=বদলাতে, বাতিল করতে বা কোনো সমস্যা হলে
returns.problem.text=প্রতিটি উপহার আপনার জন্য আলাদা করে বানানো হয়। ডিজাইন বদলাতে চাইলে, অর্ডার বাতিল করতে চাইলে, কিংবা উপহারে ভুল বা ভাঙা কিছু পেলে — অর্ডার কোডসহ যত তাড়াতাড়ি সম্ভব আমাদের জানান।
