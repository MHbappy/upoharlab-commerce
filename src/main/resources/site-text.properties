# Default wording for everything customers see. The owner can change any of it in Admin → Site text;
# edits are stored in the database and this file keeps the defaults.
#
# Format: key=text. "##" starts a group (the page shown in the admin). \n is a line break.
# "?key=text" marks an optional text the owner may empty to hide.
# {0}, {1}… are filled in by the page (a price, a date, a name). Do not use other curly brackets.
# Adding a key here makes it editable; templates use it as #{key}.

