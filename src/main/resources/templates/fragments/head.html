<!DOCTYPE html>
<html lang="bn" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title, description, path, image, private)">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title th:text="${title}">উপহার ল্যাব</title>
<meta name="description" th:if="${description != null and !#strings.isEmpty(description)}" th:content="${description}">
<meta name="robots" content="noindex" th:if="${private}">
<th:block th:unless="${private}" th:with="canonical=${@seo.url(path)}">
<link rel="canonical" th:if="${canonical != null}" th:href="${canonical}">
<meta property="og:site_name" content="উপহার ল্যাব">
<meta property="og:type" content="website">
<meta property="og:title" th:content="${title}">
<meta property="og:description" th:if="${description != null and !#strings.isEmpty(description)}" th:content="${description}">
<meta property="og:url" th:if="${canonical != null}" th:content="${canonical}">
<meta property="og:image" th:if="${image != null and @seo.url(image) != null}" th:content="${@seo.url(image)}">
</th:block>
<link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
<link rel="stylesheet" th:href="@{/css/app.css}">
<script th:src="@{/js/order.js}" defer></script>
</head>
</html>
