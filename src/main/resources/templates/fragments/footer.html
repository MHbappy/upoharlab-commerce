<!DOCTYPE html>
<html lang="bn" xmlns:th="http://www.thymeleaf.org">
<body>
<footer th:fragment="footer" class="site-footer" th:with="contact=${@settingsService.publicContact()}">
<div class="container footer-inner">
<div>
<p class="footer-brand"><th:block th:text="#{site.name}"></th:block><span aria-hidden="true"> ✳</span></p>
<p th:text="#{footer.line}"></p>
<p class="footer-contact" th:if="${!contact.isEmpty()}">
<a th:if="${contact['whatsappLink'] != null}" th:href="${contact['whatsappLink']}">WhatsApp</a>
<a th:if="${contact['phone'] != null}" th:href="${'tel:' + contact['phone']}" th:text="${contact['phone']}"></a>
<a th:if="${contact['email'] != null}" th:href="${'mailto:' + contact['email']}" th:text="${contact['email']}"></a>
</p>
</div>
<nav th:attr="aria-label=#{footer.nav.label}" class="footer-links">
<a th:href="@{/track}" th:text="#{footer.track}"></a>
<a th:href="@{/faq}" th:text="#{footer.faq}"></a>
<a th:href="@{/bulk}" th:text="#{footer.bulk}"></a>
<a th:href="@{/about}" th:text="#{footer.about}"></a>
<a th:href="@{/policies/delivery}" th:text="#{footer.delivery}"></a>
<a th:href="@{/policies/returns}" th:text="#{footer.returns}"></a>
<a th:href="@{/policies/privacy}" th:text="#{footer.privacy}"></a>
</nav>
</div>
<div class="container footer-bottom"><span th:text="#{footer.bottom}"></span><span th:text="#{site.name} + ' · ' + #{footer.country}"></span></div>
</footer>
</body>
</html>
