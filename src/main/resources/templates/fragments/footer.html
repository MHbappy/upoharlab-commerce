<!DOCTYPE html>
<html lang="bn" xmlns:th="http://www.thymeleaf.org">
<body>
<footer th:fragment="footer" class="site-footer" th:with="contact=${@settingsService.publicContact()}">
<div class="container footer-inner">
<div>
<p class="footer-brand">উপহার ল্যাব</p>
<p>আপনার নাম, যত্নে খোদাই করা</p>
<p class="footer-contact" th:if="${!contact.isEmpty()}">
<a th:if="${contact['whatsappLink'] != null}" th:href="${contact['whatsappLink']}">WhatsApp</a>
<a th:if="${contact['phone'] != null}" th:href="${'tel:' + contact['phone']}" th:text="${contact['phone']}"></a>
<a th:if="${contact['email'] != null}" th:href="${'mailto:' + contact['email']}" th:text="${contact['email']}"></a>
</p>
</div>
<nav aria-label="তথ্য ও নীতিমালা" class="footer-links">
<a th:href="@{/track}">অর্ডার ট্র্যাক</a>
<a th:href="@{/faq}">সাধারণ প্রশ্ন</a>
<a th:href="@{/bulk}">বেশি পরিমাণে অর্ডার</a>
<a th:href="@{/about}">আমাদের কথা</a>
<a th:href="@{/policies/delivery}">ডেলিভারি</a>
<a th:href="@{/policies/returns}">ফেরত ও বাতিল</a>
<a th:href="@{/policies/privacy}">গোপনীয়তা</a>
</nav>
</div>
</footer>
</body>
</html>
