<!DOCTYPE html>
<html lang="bn" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(#{faq.meta.title}, #{faq.meta.description}, '/faq', null, false)}">
</head>
<body>
<header th:replace="~{fragments/header :: header}">
</header>
<main id="main" class="container product-main reading-width">
<p class="eyebrow" th:text="#{faq.eyebrow}"></p>
<h1 th:text="#{faq.title}"></h1>
<p class="lead" th:text="#{faq.lead}"></p>
<h2 th:text="#{faq.design.title}"></h2>
<details th:each="n : ${ {1, 2, 3} }"><summary th:text="${#messages.msg('faq.design.q' + n)}"></summary><p th:text="${#messages.msg('faq.design.a' + n)}"></p></details>
<h2 th:text="#{faq.money.title}"></h2>
<details th:each="n : ${ {1, 2} }"><summary th:text="${#messages.msg('faq.money.q' + n)}"></summary><p th:text="${#messages.msg('faq.money.a' + n)}"></p></details>
<h2 th:text="#{faq.delivery.title}"></h2>
<th:block th:if="${!#strings.isEmpty(settings['delivery_inside']) and !#strings.isEmpty(settings['delivery_outside'])}">
<details><summary th:text="#{faq.delivery.charge.q}"></summary><p th:text="#{faq.delivery.charge.a(${'৳' + @bn.digits(settings['delivery_inside'])}, ${'৳' + @bn.digits(settings['delivery_outside'])})}"></p></details>
</th:block>
<details><summary th:text="#{faq.delivery.when.q}"></summary><p><th:block th:text="#{faq.delivery.when.a}"></th:block> <a th:href="@{/policies/delivery}" th:text="#{faq.delivery.when.link}"></a></p></details>
<details><summary th:text="#{faq.delivery.area.q}"></summary><p th:text="#{faq.delivery.area.a}"></p></details>
<details><summary th:text="#{faq.track.q}"></summary><p><th:block th:text="#{faq.track.a}"></th:block> <a th:href="@{/track}" th:text="#{faq.track.link}"></a></p></details>
<h2 th:text="#{faq.other.title}"></h2>
<details th:each="n : ${ {1, 2, 3} }"><summary th:text="${#messages.msg('faq.other.q' + n)}"></summary><p th:text="${#messages.msg('faq.other.a' + n)}"></p></details>
<p class="faq-contact" th:if="${whatsapp != null}"><a class="button" th:href="${whatsapp}" th:text="#{faq.whatsapp}"></a></p>
</main>
<footer th:replace="~{fragments/footer :: footer}">
</footer>
</body>
</html>
