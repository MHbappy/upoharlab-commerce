<!DOCTYPE html>
<html lang="bn" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(#{about.meta.title}, #{about.meta.description}, '/about', null, false)}">
</head>
<body>
<header th:replace="~{fragments/header :: header}">
</header>
<main id="main" class="container product-main reading-width">
<h1 th:text="#{about.title}"></h1>
<p class="lead" th:text="#{about.lead}"></p>
<p class="preserve-lines" th:text="#{about.text}"></p>
<th:block th:if="${whatsapp != null or !#strings.isEmpty(settings['phone']) or !#strings.isEmpty(settings['business_email'])}">
<h2 th:text="#{about.contact}"></h2>
<ul>
<li th:if="${whatsapp != null}"><a th:href="${whatsapp}">WhatsApp</a></li>
<li th:if="${!#strings.isEmpty(settings['phone'])}"><a th:href="${'tel:' + settings['phone']}" th:text="${settings['phone']}"></a></li>
<li th:if="${!#strings.isEmpty(settings['business_email'])}"><a th:href="${'mailto:' + settings['business_email']}" th:text="${settings['business_email']}"></a></li>
</ul>
</th:block>
</main>
<footer th:replace="~{fragments/footer :: footer}">
</footer>
</body>
</html>
