<!DOCTYPE html>
<html lang="bn" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(#{track.meta.title}, #{track.meta.description}, null, null, true)}">
</head>
<body>
<header th:replace="~{fragments/header :: header}">
</header>
<main id="main" class="container product-main form-width tracking-page">
<p class="eyebrow" th:text="#{track.eyebrow}"></p>
<h1 th:text="#{track.title}"></h1>
<p class="muted" th:text="#{track.lead}"></p>

<section class="panel track-result" th:if="${result != null}" aria-labelledby="result-title">
<h2 id="result-title" th:text="${result.code}"></h2>
<p class="track-status" th:text="${statusLabel}"></p>
<dl class="facts">
<dt th:text="#{track.placed}"></dt>
<dd th:text="${@bn.date(result.placedAt)}"></dd>
<th:block th:if="${result.approvedAt != null}">
<dt th:text="#{track.approved}"></dt>
<dd th:text="${@bn.date(result.approvedAt)}"></dd>
</th:block>
<th:block th:if="${result.courier != null}">
<dt th:text="#{track.courier}"></dt>
<dd th:text="${result.courier}"></dd>
<dt th:text="#{track.tracking}"></dt>
<dd th:text="${result.trackingNo}"></dd>
</th:block>
<th:block th:if="${result.deliveredAt != null}">
<dt th:text="#{track.delivered}"></dt>
<dd th:text="${@bn.date(result.deliveredAt)}"></dd>
</th:block>
</dl>
</section>

<p class="error" role="alert" th:if="${notFound}" th:text="#{track.not.found}"></p>
<p class="error" role="alert" th:if="${rateLimited}" th:text="#{track.too.many}"></p>

<form class="track-form panel" th:action="@{/track}" method="post">
<label for="code" th:text="#{track.code}"></label>
<p class="field-help" id="code-help" th:text="#{track.code.help}"></p>
<input aria-describedby="code-help" id="code" name="code" type="text" required autocomplete="off" placeholder="UL-202611-001" th:value="${code}">
<label for="phone" th:text="#{track.phone}"></label>
<input id="phone" name="phone" type="tel" required autocomplete="tel" th:value="${result == null ? phone : null}">
<button class="button" th:text="#{track.submit}"></button>
</form>
<p class="muted track-help" th:if="${whatsapp != null}"><th:block th:text="#{track.lost}"></th:block> <a th:href="${whatsapp}" th:text="#{track.lost.whatsapp}"></a></p>
<p class="muted track-help" th:if="${whatsapp == null and !#strings.isEmpty(businessPhone)}"><th:block th:text="#{track.lost}"></th:block> <th:block th:text="#{track.lost.call}"></th:block> <a th:href="${'tel:' + businessPhone}" th:text="${businessPhone}"></a></p>
</main>
<footer th:replace="~{fragments/footer :: footer}">
</footer>
</body>
</html>
