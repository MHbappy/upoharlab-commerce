<!DOCTYPE html>
<html lang="bn" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(#{home.meta.title}, #{home.meta.description}, '/', ${products.isEmpty() or products[0].cardImage() == null ? null : '/media/' + products[0].cardImage()}, false)}">
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<main id="main" class="container home-main">
  <section class="shop-intro" aria-labelledby="welcome-title">
    <div>
      <p class="eyebrow" th:text="#{home.eyebrow}"></p>
      <h1 id="welcome-title"><th:block th:text="#{home.title.line1}"></th:block><br><em th:text="#{home.title.line2}"></em></h1>
      <p class="lead" th:text="#{home.lead}"></p>
      <a class="button" href="#products"><th:block th:text="#{home.cta}"></th:block> <span aria-hidden="true">↓</span></a>
      <p class="intro-note" th:text="#{home.cta.note}"></p>
    </div>
    <a class="intro-photo" th:if="${!products.isEmpty() and products[0].cardImage() != null}" th:href="@{${products[0].orderPath()}}">
      <img fetchpriority="high" width="600" height="400" th:src="@{/media/{name}(name=${products[0].cardImage()})}" th:alt="${products[0].cardImageAlt()}">
      <span><span th:text="${products[0].details.title}"></span><span aria-hidden="true">↗</span></span>
    </a>
  </section>
  <section id="products" class="catalog section-space" aria-labelledby="catalog-title">
    <div class="section-heading"><div><p class="eyebrow" th:text="#{home.products.eyebrow}"></p><h2 id="catalog-title" th:text="#{home.products.title}"></h2></div></div>
    <div th:if="${products.isEmpty()}" class="availability">
      <span class="empty-symbol" aria-hidden="true">✳</span><div><h3 th:text="#{home.empty.title}"></h3><p th:text="#{home.empty.text}"></p><a class="text-link" th:href="${whatsapp != null ? whatsapp : '/about'}" th:text="${whatsapp != null ? #messages.msg('home.empty.whatsapp') : #messages.msg('home.empty.about')}"></a></div>
    </div>
    <th:block th:unless="${products.isEmpty()}">
      <p class="notice notice-warning" role="status" th:if="${settings['accepting_orders'] != 'true'}" th:text="${#strings.isEmpty(settings['pause_notice']) ? #messages.msg('order.paused') : settings['pause_notice']}"></p>
      <div class="product-grid">
        <article class="panel product-card" th:each="p, row : ${products}">
          <div class="card-image" th:with="image=${p.cardImage()}"><img th:if="${image != null}" th:src="@{/media/{name}(name=${'thumb-' + image})}" th:alt="${p.cardImageAlt()}" width="480" height="400" th:attr="loading=${row.index < 3 ? 'eager' : 'lazy'}"><span class="photo-placeholder" th:if="${image == null}" th:text="#{home.card.placeholder}"></span><span class="card-save" th:if="${p.cardDiscountPercent() != null}" th:text="#{home.card.discount(${@bn.digits(p.cardDiscountPercent())})}"></span></div>
          <div class="card-body"><h3><a class="card-link" th:href="@{${p.orderPath()}}" th:text="${p.details.title}"></a></h3>
          <p class="card-meta" th:with="a=${arrival[p.id()]}" th:if="${arrival[p.id()] != null}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 6h12v10H2zM14 10h4l4 3v3h-8M7 20a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM17 20a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/></svg><th:block th:text="${a.single() ? #messages.msg('home.card.arrival.one', @bn.digits(a.min())) : #messages.msg('home.card.arrival', @bn.digits(a.min()), @bn.digits(a.max()))}"></th:block></p>
          
          <p class="card-footer"><span class="card-price-group" th:classappend="${p.cardOldPrice() != null ? 'has-offer' : ''}"><span class="card-price" th:text="${@bn.money(p.details.price)}"></span> <s class="card-old-price" th:if="${p.cardOldPrice() != null}" th:text="${@bn.money(p.cardOldPrice())}"></s></span><span class="card-action" aria-hidden="true" th:text="#{home.card.action}"></span></p></div>
        </article>
      </div>
    </th:block>
  </section>
  <section id="how-it-works" class="how" aria-labelledby="process-title">
    <div class="how-head">
      <p class="eyebrow" th:text="#{home.steps.eyebrow}"></p>
      <h2 id="process-title" th:text="#{home.steps.title.line1} + ' ' + #{home.steps.title.line2}"></h2>
      <p class="how-caption" th:text="#{home.steps.caption.line1} + ' ' + #{home.steps.caption.line2}"></p>
    </div>
    <ol class="how-steps">
      <li class="how-step" th:each="n : ${ {1, 2, 3} }">
        <span class="how-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" th:switch="${n}">
            <path th:case="1" d="M5 8h14l-1.2 12H6.2L5 8zM9 8V6.5a3 3 0 0 1 6 0V8M9.5 13.5l1.8 1.8 3.4-3.6"/>
            <path th:case="2" d="m4 20 1.2-4.8L15.6 4.8a2 2 0 0 1 2.8 0l.8.8a2 2 0 0 1 0 2.8L8.8 18.8 4 20zM13.5 7l3.5 3.5"/>
            <path th:case="3" d="M2 6h12v10H2zM14 10h4l4 3v3h-8M7 20a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM17 20a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/>
          </svg>
          <span class="how-num" th:text="${@bn.digits(n)}"></span>
        </span>
        <div class="how-text"><h3 th:text="${#messages.msg('home.step' + n + '.title')}"></h3><p th:text="${#messages.msg('home.step' + n + '.text')}"></p></div>
      </li>
    </ol>
  </section>
  <section class="faq-home" aria-labelledby="faq-title">
    <div class="how-head">
      <p class="eyebrow" th:text="#{home.faq.eyebrow}"></p>
      <h2 id="faq-title" th:text="#{home.faq.title}"></h2>
      <p class="how-caption" th:text="#{home.faq.caption}"></p>
    </div>
    <div class="faq-cards">
      <details class="faq-card" th:each="n : ${ {1, 2, 3, 4, 5, 6} }"><summary th:text="${#messages.msg('home.faq' + n + '.q')}"></summary><p th:text="${#messages.msg('home.faq' + n + '.a')}"></p></details>
    </div>
    <div class="faq-help">
      <div class="faq-help-copy"><h3 th:text="#{home.contact.title}"></h3><p th:text="#{home.contact.text}"></p></div>
      <div class="faq-help-actions">
        <a class="faq-help-main" th:if="${whatsapp != null}" th:href="${whatsapp}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1.3-3.9A8 8 0 1 1 8 18.8L4 20z"/></svg><th:block th:text="#{home.contact.whatsapp}"></th:block></a>
        <a class="faq-help-main" th:if="${whatsapp == null}" th:href="@{/bulk}" th:text="#{home.contact.bulk}"></a>
        <a class="faq-help-all" th:href="@{/faq}" th:text="#{home.faq.all}"></a>
      </div>
    </div>
  </section>
</main>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
