<!DOCTYPE html>
<html lang="bn" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(#{bulk.meta.title}, #{bulk.meta.description}, '/bulk', null, false)}">
</head>
<body>
<header th:replace="~{fragments/header :: header}">
</header>
<main id="main" class="container product-main reading-width">
<h1 th:text="#{bulk.title}"></h1>
<p class="lead" th:text="#{bulk.lead}"></p>
<h2 th:text="#{bulk.list.title}"></h2>
<ul>
<li th:each="n : ${ {1, 2, 3, 4} }" th:text="${#messages.msg('bulk.list' + n)}"></li>
</ul>
<p th:if="${whatsapp != null}"><a class="button" th:href="${whatsapp}" th:text="#{bulk.whatsapp}"></a></p>
<p th:if="${!#strings.isEmpty(settings['phone'])}"><th:block th:text="#{site.phone}"></th:block> <a th:href="${'tel:' + settings['phone']}" th:text="${settings['phone']}"></a></p>
<p class="muted" th:if="${whatsapp == null and #strings.isEmpty(settings['phone'])}" th:text="#{bulk.no.contact}"></p>
</main>
<footer th:replace="~{fragments/footer :: footer}">
</footer>
</body>
</html>
