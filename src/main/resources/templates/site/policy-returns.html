<!DOCTYPE html>
<html lang="bn" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(#{returns.meta.title}, #{returns.meta.description}, '/policies/returns', null, false)}">
</head>
<body>
<header th:replace="~{fragments/header :: header}">
</header>
<main id="main" class="container product-main reading-width">
<h1 th:text="#{returns.title}"></h1>
<h2 th:text="#{returns.before.title}"></h2>
<p th:text="#{returns.before.text}"></p>
<h2 th:text="#{returns.problem.title}"></h2>
<p th:text="#{returns.problem.text}"></p>
<p class="notice notice-warning" th:if="${!#strings.isEmpty(#messages.msg('returns.terms.note'))}" th:text="#{returns.terms.note}"></p>
<p th:if="${whatsapp != null}"><a class="button" th:href="${whatsapp}" th:text="#{policy.whatsapp}"></a></p>
<p th:if="${whatsapp == null and !#strings.isEmpty(settings['phone'])}"><th:block th:text="#{site.phone}"></th:block> <a th:href="${'tel:' + settings['phone']}" th:text="${settings['phone']}"></a></p>
</main>
<footer th:replace="~{fragments/footer :: footer}">
</footer>
</body>
</html>
