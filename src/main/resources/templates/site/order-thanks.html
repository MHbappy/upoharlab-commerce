<!DOCTYPE html>
<html lang="bn" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title th:text="#{thanks.title} + ' — ' + #{site.name}">উপহার ল্যাব</title>
<link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
<link rel="stylesheet" th:href="@{/css/app.css}">
<link rel="stylesheet" th:href="@{/css/landing.css}">
<link rel="stylesheet" th:href="@{/css/storefront.css}">
</head>
<body class="lp">
<header th:replace="~{fragments/header :: header}"></header>
<main id="main" class="lp-section"><div class="lp-wrap lp-confirmation" th:with="s=${thanks.selection()},d=${thanks.selection().design()}">
<h1 th:text="#{thanks.title}"></h1>
<p><th:block th:text="#{thanks.code}"></th:block> <strong class="lp-code" th:text="${order.code}"></strong></p>
<div class="lp-stage" th:if="${thanks.needsDesign()}">
<svg role="img" th:aria-label="#{product.preview.svg.label}" xmlns="http://www.w3.org/2000/svg" th:attr="viewBox=${'0 0 ' + d.imageWidth() + ' ' + d.imageHeight()}">
<rect fill="#E6D3B8" width="100%" height="100%"/>
<image th:if="${!#strings.isEmpty(d.baseImage())}" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" th:attr="href=@{/media/{n}(n=${d.baseImage()})}"/>
<text text-anchor="middle" dominant-baseline="central" th:text="${s.text()}" th:attr="x=${d.textX()},y=${d.textY()},font-size=${s.fontSize()},fill=${d.color()},font-family=${s.font()}"></text>
</svg>
</div>
<p class="lp-caption" th:if="${thanks.needsDesign()}" th:text="#{thanks.preview.note}"></p>
<dl class="lp-recap">
<dt th:text="#{thanks.product}"></dt><dd th:text="${order.productTitle + ' · ' + s.packageName()}"></dd>
<th:block th:each="o : ${s.options()}"><dt th:text="${o.label()}"></dt><dd th:text="${o.value()}"></dd></th:block>
<th:block th:each="u : ${s.upsells()}"><dt th:text="#{product.summary.extras}"></dt><dd th:text="${u.label()}"></dd></th:block>
<dt class="lp-total" th:text="#{product.summary.total}"></dt><dd class="lp-total" th:text="${@bn.money(thanks.total())}"></dd>
<dt th:text="#{thanks.advance}"></dt><dd th:text="${@bn.money(thanks.advance())}"></dd>
<dt th:text="#{thanks.balance}"></dt><dd th:text="${@bn.money(thanks.balance())}"></dd>
</dl>
<p class="lp-notice" th:text="${#messages.msg(thanks.needsDesign() ? 'thanks.next' : 'thanks.next.plain')}"></p>
<p th:if="${thanks.advance() > 0}" th:text="${#messages.msg(thanks.needsDesign() ? 'thanks.advance.note' : 'thanks.advance.note.plain')}"></p>
<a class="lp-btn" th:if="${whatsappWithCode != null}" th:href="${whatsappWithCode}" th:text="#{site.whatsapp}"></a>
<p><a th:href="@{/track}" th:text="#{thanks.track}"></a></p>
</div></main>
<footer th:replace="~{fragments/footer :: footer}"></footer>
<script th:if="${@pixel.enabled()}" th:src="@{/js/pixel.js}" defer th:with="pixelId=${@pixel.id()}" th:attr="data-pixel=${pixelId},data-purchase=${order.code},data-value=${thanks.total()}"></script>
</body>
</html>
