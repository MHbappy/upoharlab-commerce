<!DOCTYPE html>
<html lang="bn" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(#{delivery.meta.title}, #{delivery.meta.description}, '/policies/delivery', null, false)}">
</head>
<body>
<header th:replace="~{fragments/header :: header}">
</header>
<main id="main" class="container product-main reading-width">
<h1 th:text="#{delivery.title}"></h1>
<h2 th:text="#{delivery.where.title}"></h2>
<p th:text="#{delivery.where.text}"></p>
<p th:if="${!#strings.isEmpty(settings['delivery_inside']) and !#strings.isEmpty(settings['delivery_outside'])}" th:text="#{delivery.charge(${'৳' + @bn.digits(settings['delivery_inside'])}, ${'৳' + @bn.digits(settings['delivery_outside'])})}"></p>
<h2 th:text="#{delivery.time.title}"></h2>
<p th:text="#{delivery.time.text}"></p>
<p th:if="${!#strings.isEmpty(settings['courier_days_inside_min'])}" th:text="#{delivery.time.inside(${@bn.digits(settings['courier_days_inside_min'])}, ${@bn.digits(settings['courier_days_inside_max'])})}"></p>
<p th:if="${!#strings.isEmpty(settings['courier_days_outside_min'])}" th:text="#{delivery.time.outside(${@bn.digits(settings['courier_days_outside_min'])}, ${@bn.digits(settings['courier_days_outside_max'])})}"></p>
<p th:if="${!#strings.isEmpty(settings['courier_days_inside_min']) or !#strings.isEmpty(settings['courier_days_outside_min'])}" th:text="#{delivery.time.estimate}"></p>
<h2 th:text="#{delivery.after.title}"></h2>
<p><th:block th:text="#{delivery.after.text}"></th:block> <a th:href="@{/track}" th:text="#{delivery.after.track}"></a></p>
</main>
<footer th:replace="~{fragments/footer :: footer}">
</footer>
</body>
</html>
