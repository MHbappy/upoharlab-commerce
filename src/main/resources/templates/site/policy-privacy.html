<!DOCTYPE html>
<html lang="bn" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(#{privacy.meta.title}, #{privacy.meta.description}, '/policies/privacy', null, false)}">
</head>
<body>
<header th:replace="~{fragments/header :: header}">
</header>
<main id="main" class="container product-main reading-width">
<h1 th:text="#{privacy.title}"></h1>
<th:block th:each="n : ${ {1, 2, 3, 4} }">
<h2 th:text="${#messages.msg('privacy.s' + n + '.title')}"></h2>
<p th:text="${#messages.msg('privacy.s' + n + '.text')}"></p>
</th:block>
<h2 th:text="#{privacy.cookies.title}"></h2>
<p><th:block th:text="#{privacy.cookies.text}"></th:block> <th:block th:text="${@pixel.enabled() ? #messages.msg('privacy.cookies.pixel') : #messages.msg('privacy.cookies.none')}"></th:block> <th:block th:text="#{privacy.cookies.backup}"></th:block></p>
<h2 th:text="#{privacy.delete.title}"></h2>
<p th:text="#{privacy.delete.text}"></p>
<p th:if="${whatsapp != null}"><a th:href="${whatsapp}" th:text="#{policy.whatsapp}"></a></p>
<p th:if="${!#strings.isEmpty(settings['phone'])}"><th:block th:text="#{site.phone}"></th:block> <a th:href="${'tel:' + settings['phone']}" th:text="${settings['phone']}"></a></p>
<p th:if="${!#strings.isEmpty(settings['business_email'])}"><th:block th:text="#{site.email}"></th:block> <a th:href="${'mailto:' + settings['business_email']}" th:text="${settings['business_email']}"></a></p>
</main>
<footer th:replace="~{fragments/footer :: footer}">
</footer>
</body>
</html>
