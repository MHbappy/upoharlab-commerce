<!DOCTYPE html>
<html lang="bn" xmlns:th="http://www.thymeleaf.org">
<body>
<section th:fragment="order" id="order" class="lp-section lp-order" th:if="${showOrder}" aria-labelledby="order-title">
<div class="lp-wrap">
<div class="lp-section-heading"><div><p class="lp-kicker" th:text="#{product.order.kicker}"></p><h2 id="order-title" th:text="#{product.order.title}"></h2></div><p class="lp-help"><th:block th:text="#{product.order.note.line1}"></th:block> <br><th:block th:text="#{product.order.note.line2}"></th:block></p></div>
<p id="order-message" class="lp-notice" role="status" tabindex="-1" th:if="${orderMessage}" th:text="${orderMessage}"></p>
<p class="lp-notice" role="status" th:if="${!orderable and !preview}" th:text="${product.details.status == 'PAUSED' ? #messages.msg('product.order.closed') : (#strings.isEmpty(settings['pause_notice']) ? #messages.msg('order.paused') : settings['pause_notice'])}"></p>
<form th:if="${showForm}" id="lp-form" th:object="${orderForm}" th:action="@{/order/{s}(s=${product.details.slug})} + '#order'" method="post" novalidate>
<div id="order-errors" class="lp-errors" tabindex="-1" role="alert" th:if="${#fields.hasAnyErrors()}">
<p th:text="#{product.errors.title}"></p>
<ul><li th:each="e : ${#fields.detailedErrors()}"><a th:href="${'#' + e.fieldName}" th:text="${e.message}"></a></li></ul>
</div>
<input type="hidden" name="submitToken" th:value="${submitToken}">
<input type="hidden" name="shownTotal" th:value="${shownTotal}">
<input type="hidden" name="fontSize" id="lp-font-size" th:value="*{fontSize}">
<div class="lp-hp" aria-hidden="true"><label for="website" th:text="#{product.honeypot}"></label><input id="website" name="website" type="text" tabindex="-1" autocomplete="off"></div>

<div class="lp-order-grid">
<div class="lp-order-main">
<details class="lp-order-customization" id="order-customization" open><summary><th:block th:text="#{product.choices.title}"></th:block> <span class="lp-recap-text" id="lp-selection-text" th:text="${plain ? #messages.msg('product.recap.hint.plain') : #messages.msg('product.recap.hint')}"></span><span class="lp-edit-hint" th:text="#{product.choices.edit}"></span></summary>
<fieldset class="lp-step">
<legend class="lp-sr-only" th:text="#{product.choices.title}"></legend>
<fieldset class="lp-field" id="packageIndex" th:if="${!config.packages().isEmpty()}">
<legend class="lp-label" th:text="#{product.package.label}"></legend>
<div class="lp-package-choices">
<label class="lp-choice lp-package" th:each="t, i : ${config.packages()}">
<input type="radio" name="packageIndex" th:value="${i.index}" th:checked="${orderForm.packageIndex == '' + i.index}">
<span class="lp-package-copy"><strong th:text="${t.name()}"></strong></span>
<strong class="lp-package-price" th:if="${t.price() != null}" th:text="${@bn.money(t.price())}"></strong>
</label>
</div>
<p class="lp-error" th:if="${#fields.hasErrors('packageIndex')}" th:errors="*{packageIndex}"></p>
</fieldset>
<div class="lp-field" th:unless="${plain}">
<label for="engraving"><th:block th:text="${textLabel}"></th:block><span class="lp-optional" th:if="${textMode == 'OPTIONAL'}" th:text="' ' + #{product.optional}"></span></label>
<input id="engraving" th:field="*{engraving}" type="text" autocomplete="off" th:placeholder="${textPlaceholder}" aria-describedby="engraving-help" th:errorclass="lp-invalid" th:attr="maxlength=${config.preview().maxChars()}">
<div class="lp-input-help"><p class="lp-help" id="engraving-help" th:text="${textHelp}"></p><span class="lp-help" data-js-only hidden><span data-character-count>০</span> / <span th:text="${@bn.digits(config.preview().maxChars())}"></span></span></div>
<p class="lp-error" th:if="${#fields.hasErrors('engraving')}" th:errors="*{engraving}"></p>
<p class="lp-error" id="confirmEngraving" th:if="${#fields.hasErrors('confirmEngraving')}" th:errors="*{confirmEngraving}"></p>
</div>
<div class="lp-field lp-compact" role="group" th:attr="aria-label=${o.label()}" th:id="${optRow.first ? 'options' : null}" th:each="o, optRow : ${config.options()}">
<p class="lp-label" th:text="${o.label()}"></p>
<label class="lp-choice" th:each="v, i : ${o.values()}"><input type="radio" th:name="${'opt' + optRow.index}" th:value="${i.index}" th:checked="${orderForm.options.size() > optRow.index and orderForm.options[optRow.index] == '' + i.index}"> <img th:if="${!#strings.isEmpty(v.image())}" th:src="@{/media/{n}(n=${'thumb-' + v.image()})}" alt="" loading="lazy" width="40" height="40"> <span th:text="${v.name() + (v.priceDelta() != null and v.priceDelta() > 0 ? ' (+' + @bn.money(v.priceDelta()) + ')' : '')}"></span></label>
</div>
<p class="lp-error" th:if="${#fields.hasErrors('options')}" th:errors="*{options}"></p>
<input type="hidden" name="font" th:unless="${config.showsPreview()}" th:value="${config.preview().fonts()[0]}">
<div class="lp-field lp-compact" role="group" th:aria-label="#{product.font.label}" id="font" th:if="${config.showsPreview() and !config.preview().fonts().isEmpty()}">
<p class="lp-label" th:text="#{product.font.label}"></p>
<label class="lp-choice" th:each="f, i : ${config.preview().fonts()}"><input type="radio" name="font" th:value="${f}" th:checked="${orderForm.font == f}"> <span class="lp-font-sample" th:attr="data-font-sample=${f}" th:classappend="${'font-' + i.index}"><span th:text="#{product.text.sample}"></span><small th:text="${f}"></small></span></label>
<p class="lp-error" th:if="${#fields.hasErrors('font')}" th:errors="*{font}"></p>
</div>
<div class="lp-field lp-compact" role="group" th:aria-label="#{product.design.label}" id="design" th:if="${config.showsPreview() and config.preview().designs().size() > 1}">
<p class="lp-label" th:text="#{product.design.label}"></p>
<label class="lp-choice" th:each="d, i : ${config.preview().designs()}"><input type="radio" name="design" th:value="${i.index}" th:checked="${orderForm.design == '' + i.index}"> <img th:if="${!#strings.isEmpty(d.baseImage())}" th:src="@{/media/{n}(n=${'thumb-' + d.baseImage()})}" alt="" loading="lazy" width="40" height="40"> <span th:text="${d.name()}"></span></label>
<p class="lp-error" th:if="${#fields.hasErrors('design')}" th:errors="*{design}"></p>
</div>
<input type="hidden" name="design" value="0" th:unless="${config.showsPreview() and config.preview().designs().size() > 1}">
<div class="lp-field" id="upsells" th:if="${!config.upsells().isEmpty()}">
<p class="lp-label" th:text="#{product.extras.label}"></p>
<label class="lp-choice" th:each="u, i : ${config.upsells()}"><input type="checkbox" name="upsells" th:value="${i.index}" th:checked="${orderForm.upsells != null and orderForm.upsells.contains('' + i.index)}"> <span th:text="${u.label() + (u.price() != null ? ' (+' + @bn.money(u.price()) + ')' : '')}"></span></label>
<p class="lp-error" th:if="${#fields.hasErrors('upsells')}" th:errors="*{upsells}"></p>
</div>
</fieldset>
</details>
<fieldset class="lp-step">
<legend th:text="#{product.customer.title}"></legend>
<div class="lp-field">
<label for="name" th:text="#{product.customer.name}"></label>
<input id="name" th:field="*{name}" type="text" autocomplete="name" th:errorclass="lp-invalid">
<p class="lp-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
</div>
<div class="lp-field">
<label for="phone" th:text="#{product.customer.phone}"></label>
<input id="phone" th:field="*{phone}" type="tel" autocomplete="tel" inputmode="tel" th:placeholder="#{product.customer.phone.placeholder}" th:errorclass="lp-invalid">
<p class="lp-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></p>
</div>
<div class="lp-field lp-compact" role="group" th:aria-label="#{product.customer.area}" id="area">
<p class="lp-label" th:text="#{product.customer.area}"></p>
<th:block th:with="d=${config.delivery()}">
<label class="lp-choice"><input type="radio" name="area" value="INSIDE" th:checked="${orderForm.area == 'INSIDE'}"> <span th:text="${#messages.msg('product.customer.inside') + (d.insideDhakaCharge() != null ? ' (' + @bn.money(d.insideDhakaCharge()) + ')' : '')}"></span></label>
<label class="lp-choice"><input type="radio" name="area" value="OUTSIDE" th:checked="${orderForm.area == 'OUTSIDE'}"> <span th:text="${#messages.msg('product.customer.outside') + (d.outsideDhakaCharge() != null ? ' (' + @bn.money(d.outsideDhakaCharge()) + ')' : '')}"></span></label>
</th:block>
<p class="lp-error" th:if="${#fields.hasErrors('area')}" th:errors="*{area}"></p>
</div>
<div class="lp-field">
<label for="address" th:text="#{product.customer.address}"></label>
<textarea id="address" th:field="*{address}" rows="3" th:placeholder="#{product.customer.address.placeholder}" autocomplete="street-address" th:errorclass="lp-invalid"></textarea>
<p class="lp-error" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></p>
</div>
<details class="lp-extra" th:open="${#fields.hasErrors('neededBy') or #fields.hasErrors('note') or !#strings.isEmpty(orderForm.neededBy) or !#strings.isEmpty(orderForm.note)}"><summary><th:block th:text="#{product.extra.summary}"></th:block> <span class="lp-optional" th:text="#{product.optional}"></span></summary>
<div class="lp-field">
<label for="neededBy" th:text="#{product.extra.needed}"></label>
<input id="neededBy" th:field="*{neededBy}" type="date" th:errorclass="lp-invalid">
<p class="lp-error" th:if="${#fields.hasErrors('neededBy')}" th:errors="*{neededBy}"></p>
</div>
<div class="lp-field">
<label for="note" th:text="#{product.extra.note}"></label>
<textarea id="note" th:field="*{note}" rows="2" th:errorclass="lp-invalid"></textarea>
<p class="lp-error" th:if="${#fields.hasErrors('note')}" th:errors="*{note}"></p>
</div>
</details>
</fieldset>

</div>
<aside class="lp-order-side">
<h3 th:text="#{product.summary.title}"></h3>
<section class="lp-summary" aria-live="polite" th:aria-label="#{product.summary.title}" th:if="${quote != null}">
<dl>
<dt><th:block th:text="#{product.package.label}"></th:block> <span class="lp-summary-package" data-package-name th:text="${selectedPackageName}"></span></dt><dd data-line="package" th:text="${@bn.money(quote.packagePrice())}"></dd>
<dt th:text="#{product.summary.extras}"></dt><dd data-line="extras" th:text="${@bn.money(quote.extras())}"></dd>
<dt th:text="#{product.summary.delivery}"></dt><dd data-line="delivery" th:text="${quote.delivery() != null ? @bn.money(quote.delivery()) : #messages.msg('product.summary.delivery.waiting')}"></dd>
<dt class="lp-total" th:text="#{product.summary.total}"></dt><dd class="lp-total" data-line="total"><th:block th:text="${@bn.money(quote.total() != null ? quote.total() : quote.packagePrice() + quote.extras())}"></th:block><small class="lp-total-note" th:if="${quote.total() == null}" th:text="' ' + #{product.summary.plus.delivery}"></small></dd>
</dl>
<p class="lp-payment" data-payment-note th:text="${config.advanceAmount() > 0 ? #messages.msg(plain ? 'product.advance.note.plain' : 'product.advance.note', @bn.money(quote.advance() != null ? quote.advance() : config.advanceAmount())) : #messages.msg('product.advance.none')}"></p>
<p class="lp-help" th:text="#{product.summary.no.payment}"></p>
</section>

<div class="lp-actions" th:if="${orderable}">
<p class="lp-notice" th:if="${reviewNeeded}" th:text="#{product.review.notice}"></p>
<button class="lp-link" type="submit" name="action" value="quote" data-no-js-only th:text="#{product.quote.update}"></button>
<button class="lp-btn lp-submit" type="submit" name="action" value="submit"><th:block th:text="#{product.submit}"></th:block> <span aria-hidden="true">→</span></button>
</div>
<p class="lp-help lp-submit-help" th:text="${plain ? #messages.msg('product.submit.help.plain') : #messages.msg('product.submit.help')}"></p>
<a class="lp-link" th:if="${whatsapp != null}" th:href="${whatsapp}" th:text="#{product.whatsapp}"></a>
</aside>
</div>
</form>
</div>
</section>
</body>
</html>
