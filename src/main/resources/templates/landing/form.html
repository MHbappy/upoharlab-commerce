<!DOCTYPE html>
<html lang="bn" xmlns:th="http://www.thymeleaf.org">
<body>
<section th:fragment="order" id="order" class="lp-section lp-order" th:if="${showOrder}" aria-labelledby="order-title">
<div class="lp-wrap">
<h2 id="order-title">অর্ডার করুন</h2>
<p id="order-message" class="lp-notice" role="status" tabindex="-1" th:if="${orderMessage}" th:text="${orderMessage}"></p>
<p class="lp-notice" role="status" th:if="${!orderable and !preview}" th:text="${product.details.status == 'PAUSED' ? 'এই পণ্যের অর্ডার এখন বন্ধ আছে।' : (#strings.isEmpty(settings['pause_notice']) ? 'অনলাইনে অর্ডার নেওয়া এখন বন্ধ আছে।' : settings['pause_notice'])}"></p>
<form th:if="${showForm}" id="lp-form" th:object="${orderForm}" th:action="@{/order/{s}(s=${product.details.slug})} + '#order'" method="post" novalidate>
<div id="order-errors" class="lp-errors" tabindex="-1" role="alert" th:if="${#fields.hasAnyErrors()}">
<p>অর্ডার পাঠানোর আগে এগুলো ঠিক করুন:</p>
<ul><li th:each="e : ${#fields.detailedErrors()}"><a th:href="${'#' + e.fieldName}" th:text="${e.message}"></a></li></ul>
</div>
<input type="hidden" name="submitToken" th:value="${submitToken}">
<input type="hidden" name="shownTotal" th:value="${shownTotal}">
<input type="hidden" name="fontSize" id="lp-font-size" th:value="*{fontSize}">
<div class="lp-hp" aria-hidden="true"><label for="website">এই ঘরটি খালি রাখুন</label><input id="website" name="website" type="text" tabindex="-1" autocomplete="off"></div>

<div class="lp-order-grid">
<div class="lp-order-main">
<fieldset>
<legend>কী বানাব</legend>
<div class="lp-field">
<label for="engraving">কী খোদাই হবে</label>
<input id="engraving" th:field="*{engraving}" type="text" autocomplete="off" th:errorclass="lp-invalid" th:attr="maxlength=${config.preview().maxChars()}">
<p class="lp-error" th:if="${#fields.hasErrors('engraving')}" th:errors="*{engraving}"></p>
</div>
<div class="lp-field">
<label for="confirmEngraving">লেখাটি আবার লিখুন (বানান মেলাতে)</label>
<input id="confirmEngraving" th:field="*{confirmEngraving}" type="text" autocomplete="off" th:errorclass="lp-invalid" th:attr="maxlength=${config.preview().maxChars()}">
<p class="lp-error" th:if="${#fields.hasErrors('confirmEngraving')}" th:errors="*{confirmEngraving}"></p>
</div>
<div class="lp-field" id="packageIndex" th:if="${!config.packages().isEmpty()}">
<p class="lp-label">প্যাকেজ</p>
<label class="lp-choice" th:each="t, i : ${config.packages()}"><input type="radio" name="packageIndex" th:value="${i.index}" th:checked="${orderForm.packageIndex == '' + i.index}"> <span th:text="${t.name() + (t.price() != null ? ' — ' + @bn.money(t.price()) : '')}"></span></label>
<p class="lp-error" th:if="${#fields.hasErrors('packageIndex')}" th:errors="*{packageIndex}"></p>
</div>
<div class="lp-field lp-compact" th:id="${optRow.first ? 'options' : null}" th:each="o, optRow : ${config.options()}">
<p class="lp-label" th:text="${o.label()}"></p>
<label class="lp-choice" th:each="v, i : ${o.values()}"><input type="radio" th:name="${'opt' + optRow.index}" th:value="${i.index}" th:checked="${orderForm.options.size() > optRow.index and orderForm.options[optRow.index] == '' + i.index}"> <img th:if="${!#strings.isEmpty(v.image())}" th:src="@{/media/{n}(n=${'thumb-' + v.image()})}" alt="" loading="lazy" width="40" height="40"> <span th:text="${v.name() + (v.priceDelta() != null and v.priceDelta() > 0 ? ' (+' + @bn.money(v.priceDelta()) + ')' : '')}"></span></label>
</div>
<p class="lp-error" th:if="${#fields.hasErrors('options')}" th:errors="*{options}"></p>
<input type="hidden" name="font" th:unless="${config.sections().preview()}" th:value="${config.preview().fonts()[0]}">
<div class="lp-field lp-compact" id="font" th:if="${config.sections().preview() and !config.preview().fonts().isEmpty()}">
<p class="lp-label">ফন্ট</p>
<label class="lp-choice" th:each="f, i : ${config.preview().fonts()}"><input type="radio" name="font" th:value="${f}" th:checked="${orderForm.font == f}"> <span th:text="${'ফন্ট ' + @bn.digits(i.count)}"></span></label>
<p class="lp-error" th:if="${#fields.hasErrors('font')}" th:errors="*{font}"></p>
</div>
<div class="lp-field lp-compact" id="design" th:if="${config.sections().preview() and config.preview().designs().size() > 1}">
<p class="lp-label">ডিজাইন</p>
<label class="lp-choice" th:each="d, i : ${config.preview().designs()}"><input type="radio" name="design" th:value="${i.index}" th:checked="${orderForm.design == '' + i.index}"> <span th:text="${d.name()}"></span></label>
<p class="lp-error" th:if="${#fields.hasErrors('design')}" th:errors="*{design}"></p>
</div>
<input type="hidden" name="design" value="0" th:unless="${config.sections().preview() and config.preview().designs().size() > 1}">
<div class="lp-field" id="upsells" th:if="${!config.upsells().isEmpty()}">
<p class="lp-label">সাথে নিতে চান? (ঐচ্ছিক)</p>
<label class="lp-choice" th:each="u, i : ${config.upsells()}"><input type="checkbox" name="upsells" th:value="${i.index}" th:checked="${orderForm.upsells != null and orderForm.upsells.contains('' + i.index)}"> <span th:text="${u.label() + (u.price() != null ? ' (+' + @bn.money(u.price()) + ')' : '')}"></span></label>
<p class="lp-error" th:if="${#fields.hasErrors('upsells')}" th:errors="*{upsells}"></p>
</div>
<div class="lp-field">
<label for="neededBy">কবের মধ্যে লাগবে? (ঐচ্ছিক)</label>
<input id="neededBy" th:field="*{neededBy}" type="date" th:errorclass="lp-invalid">
<p class="lp-error" th:if="${#fields.hasErrors('neededBy')}" th:errors="*{neededBy}"></p>
</div>
</fieldset>

<fieldset>
<legend>আপনার তথ্য</legend>
<div class="lp-field">
<label for="name">আপনার নাম</label>
<input id="name" th:field="*{name}" type="text" autocomplete="name" th:errorclass="lp-invalid">
<p class="lp-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
</div>
<div class="lp-field">
<label for="phone">মোবাইল নম্বর</label>
<input id="phone" th:field="*{phone}" type="tel" autocomplete="tel" inputmode="tel" placeholder="01XXXXXXXXX" th:errorclass="lp-invalid">
<p class="lp-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></p>
</div>
<div class="lp-field lp-compact" id="area">
<p class="lp-label">ডেলিভারি কোথায়</p>
<th:block th:with="d=${config.delivery()}">
<label class="lp-choice"><input type="radio" name="area" value="INSIDE" th:checked="${orderForm.area == 'INSIDE'}"> <span th:text="${'ঢাকার ভেতরে' + (d.insideDhakaCharge() != null ? ' (' + @bn.money(d.insideDhakaCharge()) + ')' : '')}"></span></label>
<label class="lp-choice"><input type="radio" name="area" value="OUTSIDE" th:checked="${orderForm.area == 'OUTSIDE'}"> <span th:text="${'ঢাকার বাইরে' + (d.outsideDhakaCharge() != null ? ' (' + @bn.money(d.outsideDhakaCharge()) + ')' : '')}"></span></label>
</th:block>
<p class="lp-error" th:if="${#fields.hasErrors('area')}" th:errors="*{area}"></p>
</div>
<div class="lp-field">
<label for="address">পুরো ঠিকানা</label>
<textarea id="address" th:field="*{address}" rows="3" autocomplete="street-address" th:errorclass="lp-invalid"></textarea>
<p class="lp-error" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></p>
</div>
<div class="lp-field">
<label for="note">কিছু জানাতে চান? (ঐচ্ছিক)</label>
<textarea id="note" th:field="*{note}" rows="2" th:errorclass="lp-invalid"></textarea>
<p class="lp-error" th:if="${#fields.hasErrors('note')}" th:errors="*{note}"></p>
</div>
</fieldset>

</div>
<aside class="lp-order-side">
<section class="lp-summary" aria-live="polite" aria-label="মোট হিসাব" th:if="${quote != null}">
<dl>
<dt>প্যাকেজ</dt><dd data-line="package" th:text="${@bn.money(quote.packagePrice())}"></dd>
<dt>অতিরিক্ত</dt><dd data-line="extras" th:text="${@bn.money(quote.extras())}"></dd>
<dt>ডেলিভারি</dt><dd data-line="delivery" th:text="${quote.delivery() != null ? @bn.money(quote.delivery()) : 'এলাকা বাছলে দেখাবে'}"></dd>
<dt class="lp-total">মোট</dt><dd class="lp-total" data-line="total" th:text="${quote.total() != null ? @bn.money(quote.total()) : 'এলাকা বাছলে দেখাবে'}"></dd>
</dl>
<p class="lp-advance" th:text="${'মাত্র ' + @bn.money(quote.advance() != null ? quote.advance() : config.advanceAmount()) + ' অগ্রিম, বাকিটা হাতে পেয়ে দেবেন। ডিজাইন পছন্দ না হলে অগ্রিম ফেরত।'}" data-line="advance"></p>
</section>

<div class="lp-actions" th:if="${orderable}">
<p class="lp-notice" th:if="${reviewNeeded}">মোট হিসাব মিলিয়ে দেখুন, তারপর আবার চাপুন।</p>
<button class="lp-link" type="submit" name="action" value="quote" data-no-js-only>হিসাব আপডেট করুন</button>
<button class="lp-btn lp-submit" type="submit" name="action" value="submit" th:text="${'আমার ' + product.details.title + ' কনফার্ম করুন'}"></button>
</div>
</aside>
</div>
</form>
</div>
</section>
</body>
</html>
