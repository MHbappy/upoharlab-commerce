<!DOCTYPE html>
<html lang="bn" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(null, null, null, null, true)}">
</head>
<body>
<header th:replace="~{fragments/header :: header}">
</header>
<main id="main" class="container product-main reading-width">
<th:block th:switch="${status}">
<th:block th:case="404">
<h1 th:text="#{error.404.title}"></h1>
<p th:text="#{error.404.text}"></p>
</th:block>
<th:block th:case="403">
<h1 th:text="#{error.403.title}"></h1>
<p th:text="#{error.403.text}"></p>
</th:block>
<th:block th:case="*">
<h1 th:text="#{error.other.title}"></h1>
<p th:text="#{error.other.text}"></p>
</th:block>
</th:block>
<a class="button" th:href="@{/}" th:text="#{site.home}"></a>
</main>
<footer th:replace="~{fragments/footer :: footer}">
</footer>
</body>
</html>
