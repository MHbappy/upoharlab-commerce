<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Upohar Lab · Admin</title>
<link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
<link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:replace="~{fragments/admin :: header}">
</header>
<main class="container admin-main">
<p class="notice" role="status" th:if="${message}" th:text="${message}">
</p>
<p class="error" role="alert" th:if="${error}" th:text="${error}">
</p>
<div class="section-heading">
<h1>Products</h1>
<a class="button" th:href="@{/admin/products/new}">Add product</a>
</div>
<div class="product-grid">
<article class="panel" th:each="p : ${products}">
<img th:if="${p.cardImage() != null}" th:src="@{/media/{name}(name=${'thumb-' + p.cardImage()})}" th:alt="${p.cardImageAlt()}" loading="lazy">
<span class="admin-no-photo" th:if="${p.cardImage() == null}">No photo yet</span>
<p><span class="status-pill" th:text="${p.details.status == 'ACTIVE' ? 'Active' : (p.details.status == 'PAUSED' ? 'Paused' : 'Draft')}"></span></p>
<h2 th:text="${p.details.title}">
</h2>
<p th:text="${p.details.price != null ? '৳' + p.details.price : 'No price yet'}">
</p>
<p class="photo-actions"><a th:href="@{/admin/products/{id}(id=${p.id})}">Edit product</a><a th:if="${p.landing != null}" th:href="@{/admin/products/{id}/landing-preview(id=${p.id})}">Preview</a><span class="muted" th:if="${p.details.status != 'DRAFT' and !p.landingEnabled()}">Hidden: needs a landing page</span></p>
</article>
</div>
</main>
</body>
</html>
