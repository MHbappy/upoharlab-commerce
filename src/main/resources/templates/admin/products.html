<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Upohar Lab · Admin</title>
<link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:replace="~{fragments/admin :: header}">
</header>
<main class="container admin-main">
<p class="notice" role="status" th:if="${message}" th:text="${message}">
</p>
<p class="error" role="alert" th:if="${error}" th:text="${error}">
</p>
<div class="section-heading">
<h1>Products</h1>
<a class="button" th:href="@{/admin/products/new}">Add product</a>
</div>
<div class="product-grid">
<article class="panel" th:each="p : ${products}">
<p class="eyebrow" th:text="${p.details.status}">
</p>
<h2 th:text="${p.details.title}">
</h2>
<p th:if="${p.details.price != null}" th:text="${'৳' + p.details.price}">
</p>
<a th:href="@{/admin/products/{id}(id=${p.id})}">Edit product</a>
</article>
</div>
</main>
</body>
</html>
