<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Upohar Lab · Admin</title>
<link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
<link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:replace="~{fragments/admin :: header}">
</header>
<main class="container admin-main">
<p class="notice" role="status" th:if="${message}" th:text="${message}">
</p>
<p class="error" role="alert" th:if="${error}" th:text="${error}">
</p>
<h1>Dashboard</h1>
<div class="admin-links">
<a class="panel" th:href="@{/admin/orders(status='NEW')}">
<p class="stat" th:text="${counts.fresh}"></p>
<p>New orders</p>
</a>
<a class="panel" th:href="@{/admin/orders(status='MAKING')}">
<p class="stat" th:text="${counts.making}"></p>
<p>Being made</p>
</a>
<a class="panel" th:href="@{/admin/orders(status='SHIPPED')}">
<p class="stat" th:text="${counts.shipped}"></p>
<p>Shipped, awaiting delivery</p>
</a>
</div>
<div class="section-heading">
<h2>Recent orders</h2>
<a th:href="@{/admin/orders}">All orders</a>
</div>
<p th:if="${recent.isEmpty()}">No orders yet.</p>
<div th:unless="${recent.isEmpty()}" th:replace="~{fragments/admin-orders :: table(${recent})}"></div>
</main>
</body>
</html>
